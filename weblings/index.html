<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hero Section</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>
 
<section class="hero">
 
  <div class="hero-copy">
    <span class="eyebrow">Manage Work Without Limits</span>
    <h1>Where Teams and <span class="highlight">Technology</span> Connect</h1>
    <p>Our SaaS platform is built to help businesses simplify operations, improve productivity, and scale more efficiently.</p>
    <div class="hero-actions">
      <a href="#" class="btn-primary">Start Free Trial
        <img class="icon-arrow" src="resources\right-arrow.png" alt="">
      </a>
      <a href="#" class="btn-ghost">Watch Demo
        <span class="play">
          <img class="icon-play" src="resources\play-button-arrowhead.png" alt="">
        </span>
      </a>
    </div>
  </div>
 
  <div class="hero-visual">
    <!-- Abstract 3D / glass background graphic -->
    <img class="hero-bg-graphic" src="resources\grafic.webp" alt="grafic">
 
    <!-- Dashboard / product mockup screenshot -->
    <div class="dashboard-glass">
      <img class="hero-dashboard" src="resources\Dashbord.webp" alt="Product dashboard">
    </div>

    <img class="floating-card card-gender" src="resources\hero-small-grafic.png" alt="Gender breakdown">
    <img class="floating-card card-age" src="resources\hero-medium-grafic.webp" alt="Age range breakdown">
 
  </div>
 
</section>

<!-- ---------- INDUSTRIES CAROUSEL ---------- -->
<section class="industries">
  <h2 class="industries-heading">We Provide Digital Solutions for Every Industry</h2>
 
  <div class="carousel-viewport">
    <div class="carousel-track">
      <!-- Original 6 items -->
      <div class="carousel-item"><img src="resources\Education.png" alt="Educational"></div>
      <div class="carousel-item"><img src="resources\Real-Estate.png" alt="Real Estate"></div>
      <div class="carousel-item"><img src="resources\Travel.png" alt="Travel"></div>
      <div class="carousel-item"><img src="resources\Health-Care.png" alt="Health Care"></div>
      <div class="carousel-item"><img src="resources\Ecommerce.png" alt="Ecommerce"></div>
      <div class="carousel-item"><img src="resources\Portfolio.png" alt="Portfolio"></div>
 
      <!-- Cloned 6 items - enables the seamless infinite loop -->
      <div class="carousel-item"><img src="resources\Education.png" alt="Educational"></div>
      <div class="carousel-item"><img src="resources\Real-Estate.png" alt="Real Estate"></div>
      <div class="carousel-item"><img src="resources\Travel.png" alt="Travel"></div>
      <div class="carousel-item"><img src="resources\Health-Care.png" alt="Health Care"></div>
      <div class="carousel-item"><img src="resources\Ecommerce.png" alt="Ecommerce"></div>
      <div class="carousel-item"><img src="resources\Portfolio.png" alt="Portfolio"></div>
    </div>
  </div>
</section>
<script src="script.js"></script>

 
 
</body>
</html>
